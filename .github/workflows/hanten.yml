name: Hanten

# The `hanten` review round as a check. nen/gates.json names `hanten` as the
# base reviewer, and `nen pr ready` counts this job's SUCCESS as its round.
# The job reads only the pull request BODY, which is where hatsu's shibari
# pastes hanten's settled findings, so it re-runs on `edited`: settling a
# finding is a body edit.
#
# Adapted at Hatsu adoption (2026-10-22) from zheref/KroApple's
# .github/workflows/hanten.yml for a public repository on hosted runners: the
# gate script is read from the pull request's own head checkout (contents:
# read, no persisted credentials) instead of being fetched into a persistent
# self-hosted runner's temp dir. ci_scripts/hanten_gate.sh is copied verbatim.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

concurrency:
  group: hanten-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hanten:
    name: hanten
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Same-repository guard: a fork PR's round stays unmet until the maintainer acts.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: ci_scripts/hanten_gate.sh
          sparse-checkout-cone-mode: false
      - name: Check the hanten review is settled
        # The body goes through the environment, never into the script text,
        # so nothing in it can be executed.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash ci_scripts/hanten_gate.sh
